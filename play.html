<title>Gerbil Single Player</title>
<meta charset="UTF-8">
<style>
  :root {
    --cream: #f4f1ea;
    --dark: #2b2620;
    --gold: #c9a24b;
    --gold-soft: #fbf0d9;
    --green-bg: #2e7d32;
    --red: #c1443c;
    --red-soft: #fdeceb;
    --tan: #6b6355;
    --card: #4caf50;
    --good-green: #2f8f4e;
    --good-green-soft: #e3f5e9;
    --bonus2-bg: #8fd48f;
    --bonus2-border: #5fae5f;
    --bonus3-bg: #8ec3f0;
    --bonus3-border: #5f9bd8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--green-bg);
    color: var(--dark);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px;
  }

  /* One continuous panel — header and rack are two zones of the SAME
     card, sharing one background/shadow, not a dark bar floating over a
     separate green field with a smaller white box inside it. The green
     page background now only shows as a thin frame around this. */
  .screen {
    width: 100%;
    max-width: 1180px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    overflow: hidden;
  }

  /* Doubled from the original 14px/22px/18px/etc. baseline — the whole
     header reads at 2x scale, buttons included, not just the text. */
  .top-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    column-gap: 44px;
    row-gap: 14px;
    padding: 28px 44px;
    background: var(--dark);
    color: var(--cream);
  }

  .brand { font-size: 36px; font-weight: 700; margin-right: auto; }

  .stat { display: flex; flex-direction: column; align-items: center; min-width: 112px; }
  .stat .label { font-size: 21px; text-transform: uppercase; opacity: 0.7; letter-spacing: 0.04em; }
  .stat .value { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }

  #timer-stat.warn-1min .value { color: #ffcf5c; }
  #timer-stat.warn-15s .value { color: #ff6b5e; animation: timerPulse 0.6s ease infinite; }
  #timer-stat.time-up .value { color: #ff6b5e; }

  @keyframes timerPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  .icon-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 3px solid rgba(244,241,234,0.35);
    background: transparent;
    color: var(--cream);
    font-size: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-btn.is-muted { opacity: 0.5; }
  .icon-btn:hover { border-color: var(--gold); }

  .username-label {
    font-size: 26px;
    font-weight: 600;
    opacity: 0.8;
    white-space: nowrap;
  }

  /* The rack itself is the main event — this is the whole rest of the
     card below the header, same white surface, no inset box within it. */
  .active-card {
    padding: 16px 22px 22px;
    transition: background 0.4s ease;
  }

  .active-card.flash-good { animation: flashGood 0.9s ease; }
  .active-card.flash-bad { animation: flashBad 0.5s ease; }

  @keyframes flashGood {
    0% { background: var(--good-green-soft); }
    100% { background: var(--card); }
  }
  @keyframes flashBad {
    0% { background: var(--red-soft); }
    100% { background: var(--card); }
  }

  .tile-row { display: flex; gap: clamp(4px, 0.8vw, 8px); margin-bottom: 10px; }

  .tile {
    flex: 1 1 0;
    aspect-ratio: 1 / 1;
    max-width: 92px;
    min-width: 0;
    border: 1.5px solid #000;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-weight: 700;
    font-size: clamp(28px, 6.2vw, 64px);
    user-select: none;
  }

  .tile .pts { position: absolute; bottom: 3%; right: 6%; font-size: clamp(14px, 2.2vw, 25px); font-weight: 700; }

  .tile-row.tray .tile.draggable { cursor: grab; }
  .tile-row.tray .tile.draggable:hover { outline: 2px solid var(--gold); outline-offset: 1px; }
  .tile-row.tray .tile.used { opacity: 0.28; }
  .tile-row.tray .tile.dragging { opacity: 0.35; }

  .tile-row.guess .tile.empty { border-color: #d8d2c2; }
  .tile-row.guess .tile.draggable { cursor: grab; }
  .tile-row.guess .tile.draggable:hover { outline: 2px solid var(--red); outline-offset: 1px; }
  .tile-row.guess .tile.dragging { opacity: 0.35; }
  .tile-row.guess .tile.wildcard-placed { cursor: pointer; }

  /* Bonus cells are colored (no text — the color IS the label), and a
     tile keeps that color for as long as it sits there — the tile
     itself reads as "boosted," not just its point number. Move the
     tile off this slot and both the color and the ×2/×3 go away. */
  .tile-row.guess .tile.bonus2 { background: var(--bonus2-bg) !important; border-color: var(--bonus2-border); }
  .tile-row.guess .tile.bonus3 { background: var(--bonus3-bg) !important; border-color: var(--bonus3-border); }

  /* Drop-target hover feedback while dragging a tile over a cell. */
  .tile.drop-hover { outline: 3px dashed var(--gold); outline-offset: -3px; }

  .guess-toolbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }

  .hold-btn {
    border: none;
    background: #ffd23f;
    color: var(--dark);
    font-size: 21px;
    font-weight: 700;
    text-transform: uppercase;
    border-radius: 12px;
    padding: 9px 20px;
    cursor: pointer;
  }
  .hold-btn:hover:not(:disabled) { filter: brightness(1.05); }
  .hold-btn:disabled { opacity: 0.4; cursor: default; }

  .override-btn {
    border: 1.5px solid #b45f06;
    background: #ffb84d;
    color: var(--dark);
    font-size: 21px;
    font-weight: 700;
    text-transform: uppercase;
    border-radius: 12px;
    padding: 9px 20px;
    cursor: pointer;
  }
  .override-btn:hover:not(:disabled) { filter: brightness(1.05); }
  .override-btn:disabled { opacity: 0.4; cursor: default; }

  .erase-btn {
    border: 1.5px solid #e0b400;
    background: #ffd23f;
    color: var(--dark);
    font-size: 21px;
    font-weight: 700;
    text-transform: uppercase;
    border-radius: 12px;
    padding: 9px 20px;
    cursor: pointer;
  }
  .erase-btn:hover:not(:disabled) { background: #ffdc6b; }
  .erase-btn:disabled { opacity: 0.35; cursor: default; background: #ffd23f; }

  /* Word + score, centered together as one group — color alone (black
     while forming, green valid, red invalid) carries the verdict, no
     icon or "valid word"/"not a word" text needed alongside it. */
  /* Sized to fit its actual content — a word up to RACK_SIZE letters
     plus a 3-digit score ("999 pts") — rather than stretching the full
     card width, with margin: 0 auto to stay centered at that size. */
  .word-status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 12px 24px;
    border-radius: 10px;
    background: #f4f1ea;
    min-height: 26px;
    width: fit-content;
    max-width: 340px;
    margin: 0 auto;
  }

  .word-status.state-empty { color: var(--dark); }
  .word-status.state-building { color: var(--dark); }
  .word-status.state-valid { background: var(--good-green-soft); color: var(--good-green); }
  .word-status.state-invalid { background: var(--red-soft); color: var(--red); }

  .word-status .word-text { font-size: 23px; font-weight: 800; letter-spacing: 0.02em; }
  .word-status .score-num { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Single control for moving through the six racks — no prev, no dots,
     just Next, wrapping 6 back to 1. */
  .rack-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid #ece7db;
  }

  .rack-indicator { font-size: 17px; color: var(--dark); font-weight: 800; }

  .next-btn {
    border: none;
    background: #ff8c1a;
    color: var(--dark);
    font-size: 16px;
    font-weight: 700;
    border-radius: 10px;
    padding: 12px 26px;
    cursor: pointer;
  }

  .next-btn:hover { filter: brightness(1.05); }
  .next-btn:active { transform: translateY(1px); }
  .next-btn:disabled { opacity: 0.5; cursor: default; }

  /* Next Rack only — not the other buttons sharing .next-btn (Log In,
     Register, Save profile, etc.), which stay their usual orange. */
  #nav-next { background: #ffd23f; color: var(--dark); font-size: 21px; text-transform: uppercase; }

  .restart-link {
    border: none;
    background: none;
    color: var(--dark);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
  .restart-link:hover { color: var(--dark); }

  /* Wildcard letter picker — appended to body, positioned near the
     clicked wildcard tile (see openWildcardPicker). */
  .letter-menu {
    position: fixed;
    z-index: 50;
    display: grid;
    grid-template-columns: repeat(6, 34px);
    grid-auto-rows: 38px;
    gap: 3px;
    background: #fff;
    border: 1px solid #d8d2c2;
    border-radius: 8px;
    padding: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  }

  .letter-menu button {
    width: 34px;
    height: 38px;
    padding: 0;
    font-size: 16px;
    font-weight: 700;
    background: var(--cream);
    border: none;
    border-radius: 4px;
    color: var(--dark);
    cursor: pointer;
  }

  .letter-menu button:hover { background: var(--gold); }

  /* ---------- Auth screen ---------- */

  .auth-body { padding: 26px 26px 30px; max-width: 340px; margin: 0 auto; }

  .auth-tabs { display: flex; gap: 8px; margin-bottom: 20px; }

  .auth-tab {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1.5px solid #e2ddd0;
    background: #fff;
    color: var(--dark);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .auth-tab.active { background: var(--dark); color: var(--cream); border-color: var(--dark); }

  .auth-label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 16px;
  }

  .auth-input {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 11px 12px;
    border: 1.5px solid #d8d2c2;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
  }
  .auth-input:focus { outline: none; border-color: var(--gold); }

  .auth-hint { font-size: 11.5px; color: var(--dark); font-weight: 500; margin-top: 5px; }

  .auth-error {
    color: var(--red);
    font-size: 13px;
    font-weight: 600;
    min-height: 18px;
    margin-bottom: 10px;
  }

  .auth-submit { width: 100%; margin-top: 4px; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    padding: 26px;
    width: 100%;
    max-width: 360px;
  }
  .modal-title { font-size: 16px; font-weight: 800; color: var(--dark); margin-bottom: 16px; }

  /* ---------- Rack summary (all 6 words + running total) ---------- */

  .rack-summary-panel {
    width: 100%;
    max-width: 1180px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    margin: 14px auto 0;
    padding: 20px 22px 24px;
    display: none;
  }
  .rack-summary-panel.show { display: block; }

  .rack-summary-title {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--dark);
    margin-bottom: 10px;
  }

  .rack-summary-list { display: flex; flex-direction: column; gap: 6px; }

  .rack-summary-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-radius: 8px;
    background: #f4f1ea;
  }
  .rack-summary-num { font-size: 13px; font-weight: 800; color: var(--tan); width: 16px; flex-shrink: 0; }
  .rack-summary-word { flex: 1; font-size: 16px; font-weight: 700; color: var(--dark); letter-spacing: 0.02em; min-height: 1.2em; }
  .rack-summary-score { font-size: 14px; font-weight: 700; color: var(--dark); font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .rack-summary-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid #ece7db;
    font-size: 16px;
    font-weight: 800;
    color: var(--dark);
  }

  .loading-note {
    text-align: center;
    padding: 40px 22px;
    color: var(--dark);
    font-size: 14px;
    font-weight: 600;
  }

  /* ---------- Layout editor ---------- */
  /* Only #game-screen's direct pieces (see EDITABLE_IDS in the script
     below) become moveable/resizable objects — everything else on the
     page is untouched. No rotation handle anywhere, by design. */

  #game-screen.edit-mode { position: relative; }

  /* One transparent layer over the whole screen while editing — all
     mouse hit-testing goes through here (via editHitTest in the
     script), never through the game's own tiles/buttons underneath,
     so this can't collide with the tile drag-and-drop system. */
  .edit-capture-layer {
    position: absolute;
    inset: 0;
    z-index: 400;
    cursor: default;
    display: none;
  }
  #game-screen.edit-mode .edit-capture-layer { display: block; }

  .edit-outline {
    position: absolute;
    border: 2px solid #2b7de9;
    background: rgba(43, 125, 233, 0.08);
    pointer-events: none;
    z-index: 410;
    border-radius: 4px;
  }
  .edit-outline.is-group { border-style: dashed; border-color: #9b4fd6; background: rgba(155, 79, 214, 0.08); }

  .edit-handle {
    position: absolute;
    width: 14px;
    height: 14px;
    background: #fff;
    border: 2px solid #2b7de9;
    border-radius: 3px;
    z-index: 420;
    transform: translate(-50%, -50%);
  }
  .edit-handle[data-dir="nw"], .edit-handle[data-dir="se"] { cursor: nwse-resize; }
  .edit-handle[data-dir="ne"], .edit-handle[data-dir="sw"] { cursor: nesw-resize; }
  .edit-handle[data-dir="n"], .edit-handle[data-dir="s"] { cursor: ns-resize; }
  .edit-handle[data-dir="e"], .edit-handle[data-dir="w"] { cursor: ew-resize; }

  .edit-toolbar {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--dark);
    color: var(--cream);
    padding: 12px 16px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .edit-toolbar-label { font-size: 12.5px; opacity: 0.8; margin-right: 6px; }
  .edit-toolbar-btn {
    border: 1.5px solid rgba(244,241,234,0.35);
    background: transparent;
    color: var(--cream);
    font-size: 13px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .edit-toolbar-btn:disabled { opacity: 0.35; cursor: default; }
  .edit-toolbar-btn:hover:not(:disabled) { border-color: var(--gold); }
  .edit-toolbar-done { background: #ffd23f; color: var(--dark); border-color: #ffd23f; }

  /* Stays clickable (to exit edit mode) even though the capture layer
     sits visually above the rest of the top-bar once editing starts. */
  #edit-layout-btn { position: relative; z-index: 450; }
</style>

<div class="screen" id="auth-screen" style="display:none;">
  <div class="top-bar">
    <div class="brand">GERBIL SINGLE PLAYER</div>
  </div>
  <div class="auth-body">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" type="button">Log In</button>
      <button class="auth-tab" id="tab-register" type="button">Register</button>
    </div>
    <form id="auth-form">
      <label class="auth-label">
        Username
        <input class="auth-input" id="auth-username" autocomplete="username" required>
        <div class="auth-hint" id="username-hint" style="display:none;">3–20 characters: letters, numbers, underscore.</div>
      </label>
      <label class="auth-label">
        Password
        <input class="auth-input" id="auth-password" type="password" autocomplete="current-password" required>
        <div class="auth-hint" id="password-hint" style="display:none;">At least 8 characters.</div>
      </label>
      <div class="auth-error" id="auth-error"></div>
      <button class="next-btn auth-submit" id="auth-submit" type="submit">Log In</button>
    </form>
    <button class="restart-link" id="forgot-link" type="button">Forgot your password?</button>

    <form id="forgot-form" style="display:none;">
      <label class="auth-label">
        Username
        <input class="auth-input" id="forgot-username" required>
      </label>
      <label class="auth-label">
        Your email (so we can reply)
        <input class="auth-input" id="forgot-email" type="email" required>
      </label>
      <label class="auth-label">
        What happened? (optional)
        <textarea class="auth-input" id="forgot-message" rows="3" style="resize:vertical;"></textarea>
      </label>
      <div class="auth-error" id="forgot-error"></div>
      <div class="auth-error" id="forgot-success" style="display:none; color: var(--good-green);"></div>
      <button class="next-btn auth-submit" id="forgot-submit" type="submit">Send request</button>
      <button class="restart-link" id="forgot-cancel" type="button">← Back to log in</button>
    </form>
  </div>
</div>

<div class="screen" id="game-screen" style="display:none;">
  <div class="top-bar">
    <div class="brand" id="brand-title">GERBIL SINGLE PLAYER</div>
    <span class="username-label" id="username-label"></span>
    <div class="stat" id="timer-stat">
      <div class="label">Time</div>
      <div class="value" id="timer-value">10:00</div>
    </div>
    <div class="stat" id="score-stat">
      <div class="label">Score</div>
      <div class="value" id="score-value">0</div>
    </div>
    <button class="icon-btn" id="mute-btn" title="Mute sound">🔔</button>
    <button class="icon-btn" id="feedback-btn" title="Send feedback">💬</button>
    <button class="icon-btn" id="logout-btn" title="Log out">⎋</button>
    <button class="icon-btn" id="edit-layout-btn" title="Edit layout">✏️</button>
  </div>

  <div class="active-card" id="active-card">
    <div class="tile-row tray" id="tray-tiles"></div>
    <div class="tile-row guess" id="guess-tiles"></div>

    <div class="guess-toolbar">
      <button class="hold-btn" id="hold-btn" disabled>Hold</button>
      <button class="override-btn" id="override-btn" disabled>Override</button>
      <button class="erase-btn" id="erase-btn">✕ Erase</button>
    </div>

    <div class="word-status" id="word-status">
      <span class="word-text" id="word-text"></span>
      <span class="score-num" id="verdict-score"></span>
    </div>

    <div class="rack-nav">
      <span class="rack-indicator" id="rack-indicator"></span>
      <button class="next-btn" id="nav-next">Next Rack →</button>
    </div>
  </div>
  <div style="text-align:center; padding: 0 22px 16px;">
    <button class="restart-link" id="new-game-btn">↺ New Game</button>
  </div>

  <div class="rack-summary-panel" id="rack-summary-panel">
    <div class="rack-summary-title">Your words</div>
    <div class="rack-summary-list" id="rack-summary-list"></div>
    <div class="rack-summary-total">
      <span>Total</span>
      <span id="rack-summary-total-score">0 pts</span>
    </div>
  </div>
  <div class="edit-capture-layer" id="edit-capture-layer"></div>
</div>

<div class="edit-toolbar" id="edit-toolbar" style="display:none;">
  <span class="edit-toolbar-label">Editing layout — drag to move, drag a handle to resize</span>
  <button class="edit-toolbar-btn" id="group-btn" disabled>Group</button>
  <button class="edit-toolbar-btn" id="ungroup-btn" disabled>Ungroup</button>
  <button class="edit-toolbar-btn" id="reset-layout-btn">Reset layout</button>
  <button class="edit-toolbar-btn edit-toolbar-done" id="done-editing-btn">Done</button>
</div>

<div class="screen" id="loading-screen">
  <div class="loading-note">Loading…</div>
</div>

<div class="modal-overlay" id="feedback-overlay">
  <div class="modal-card">
    <div class="modal-title">Send feedback</div>
    <form id="feedback-form">
      <label class="auth-label">
        Comments or suggestions
        <textarea class="auth-input" id="feedback-message" rows="4" required style="resize:vertical;"></textarea>
      </label>
      <div class="auth-error" id="feedback-error"></div>
      <div class="auth-error" id="feedback-success" style="display:none; color: var(--good-green);"></div>
      <button class="next-btn auth-submit" id="feedback-submit" type="submit">Send</button>
      <button class="restart-link" id="feedback-cancel" type="button">Cancel</button>
    </form>
  </div>
</div>

<script>
  const MIN_WORD_LEN = 3;   // words shorter than this never even reach the server
  const GAME_SECONDS = 600; // 10-minute round, matches the real single-player rules

  // ---------- Auth ----------

  let authMode = 'login';
  const authScreen = document.getElementById('auth-screen');
  const gameScreen = document.getElementById('game-screen');
  const loadingScreen = document.getElementById('loading-screen');
  const tabLogin = document.getElementById('tab-login');
  const tabRegister = document.getElementById('tab-register');
  const authForm = document.getElementById('auth-form');
  const authError = document.getElementById('auth-error');
  const authSubmit = document.getElementById('auth-submit');
  const usernameHint = document.getElementById('username-hint');
  const passwordHint = document.getElementById('password-hint');

  function setAuthMode(mode) {
    authMode = mode;
    tabLogin.classList.toggle('active', mode === 'login');
    tabRegister.classList.toggle('active', mode === 'register');
    authSubmit.textContent = mode === 'login' ? 'Log In' : 'Create Account';
    usernameHint.style.display = mode === 'register' ? 'block' : 'none';
    passwordHint.style.display = mode === 'register' ? 'block' : 'none';
    authError.textContent = '';
  }
  tabLogin.addEventListener('click', () => setAuthMode('login'));
  tabRegister.addEventListener('click', () => setAuthMode('register'));

  function showScreen(el) {
    authScreen.style.display = el === authScreen ? 'block' : 'none';
    gameScreen.style.display = el === gameScreen ? 'block' : 'none';
    loadingScreen.style.display = el === loadingScreen ? 'block' : 'none';
    document.getElementById('rack-summary-panel').classList.toggle('show', el === gameScreen);
  }

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    authError.textContent = '';
    const username = document.getElementById('auth-username').value.trim();
    const password = document.getElementById('auth-password').value;
    authSubmit.disabled = true;
    try {
      const res = await fetch(`/api/${authMode === 'login' ? 'login' : 'register'}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        authError.textContent = data.error || 'Something went wrong.';
        return;
      }
      document.getElementById('username-label').textContent = data.username;
      showScreen(gameScreen);
      startGame();
    } catch (err) {
      authError.textContent = 'Network error — is the server running?';
    } finally {
      authSubmit.disabled = false;
    }
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    clearInterval(timerHandle);
    await fetch('/api/logout', { method: 'POST' });
    showScreen(authScreen);
  });

  // ---------- Forgot password ----------
  // No self-service reset yet — this just relays the request to the
  // site owner's inbox (see mailer.js), who handles it manually.

  const authTabs = document.querySelector('.auth-tabs');
  const forgotLink = document.getElementById('forgot-link');
  const forgotForm = document.getElementById('forgot-form');
  const forgotError = document.getElementById('forgot-error');
  const forgotSuccess = document.getElementById('forgot-success');
  const forgotSubmit = document.getElementById('forgot-submit');

  function showForgot(show) {
    authTabs.style.display = show ? 'none' : 'flex';
    authForm.style.display = show ? 'none' : 'block';
    forgotLink.style.display = show ? 'none' : 'block';
    forgotForm.style.display = show ? 'block' : 'none';
    forgotError.textContent = '';
    forgotSuccess.style.display = 'none';
  }
  forgotLink.addEventListener('click', () => showForgot(true));
  document.getElementById('forgot-cancel').addEventListener('click', () => showForgot(false));

  forgotForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    forgotError.textContent = '';
    forgotSuccess.style.display = 'none';
    const username = document.getElementById('forgot-username').value.trim();
    const contactEmail = document.getElementById('forgot-email').value.trim();
    const message = document.getElementById('forgot-message').value.trim();
    forgotSubmit.disabled = true;
    try {
      const res = await fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, contactEmail, message }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        forgotError.textContent = data.error || 'Something went wrong.';
        return;
      }
      forgotForm.reset();
      forgotSuccess.textContent = "Thanks — we'll be in touch soon.";
      forgotSuccess.style.display = 'block';
    } catch (err) {
      forgotError.textContent = 'Network error — is the server running?';
    } finally {
      forgotSubmit.disabled = false;
    }
  });

  // ---------- Feedback ----------

  const feedbackOverlay = document.getElementById('feedback-overlay');
  const feedbackForm = document.getElementById('feedback-form');
  const feedbackError = document.getElementById('feedback-error');
  const feedbackSuccess = document.getElementById('feedback-success');
  const feedbackSubmit = document.getElementById('feedback-submit');

  document.getElementById('feedback-btn').addEventListener('click', () => {
    feedbackForm.reset();
    feedbackError.textContent = '';
    feedbackSuccess.style.display = 'none';
    feedbackOverlay.classList.add('open');
  });
  document.getElementById('feedback-cancel').addEventListener('click', () => {
    feedbackOverlay.classList.remove('open');
  });

  feedbackForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    feedbackError.textContent = '';
    const message = document.getElementById('feedback-message').value.trim();
    if (!message) { feedbackError.textContent = 'Please enter a message.'; return; }
    feedbackSubmit.disabled = true;
    try {
      const res = await fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        feedbackError.textContent = data.error || 'Something went wrong.';
        return;
      }
      feedbackForm.reset();
      feedbackSuccess.textContent = 'Thanks — sent!';
      feedbackSuccess.style.display = 'block';
      setTimeout(() => feedbackOverlay.classList.remove('open'), 1200);
    } catch (err) {
      feedbackError.textContent = 'Network error — is the server running?';
    } finally {
      feedbackSubmit.disabled = false;
    }
  });

  (async function init() {
    try {
      const res = await fetch('/api/me');
      const data = await res.json();
      if (data.user) {
        document.getElementById('username-label').textContent = data.user.username;
        showScreen(gameScreen);
        await startGame();
      } else {
        showScreen(authScreen);
      }
    } catch (err) {
      showScreen(authScreen);
    }
  })();

  // ---------- Game state ----------

  let GAME_ID = null;
  let RACKS = [];
  let currentIndex = 0;
  let muted = false;
  let timeLeft = GAME_SECONDS;
  let timerHandle = null;
  let warned1min = false;
  let warned15s = false;

  async function startGame() {
    document.getElementById('nav-next').disabled = true;
    const res = await fetch('/api/game/new', { method: 'POST' });
    if (res.status === 401) {
      showScreen(authScreen);
      return;
    }
    const data = await res.json();
    GAME_ID = data.gameId;
    RACKS = data.scrambles.map(makeRack);
    currentIndex = 0;
    document.getElementById('nav-next').disabled = false;
    renderActive();
    renderRackSummary();
    startTimer();
  }

  // One row per rack showing its computed result (see computeRackResult:
  // blank + 0 pts if nothing's been held yet), plus the sum across all
  // 6 — a running record of the round distinct from the single
  // active-rack view above.
  function renderRackSummary() {
    const listEl = document.getElementById('rack-summary-list');
    let total = 0;
    listEl.innerHTML = RACKS.map((r, i) => {
      const result = computeRackResult(r);
      const word = result.valid ? result.word : '';
      const score = result.valid ? result.score : 0;
      total += score;
      return `
        <div class="rack-summary-row">
          <span class="rack-summary-num">${i + 1}</span>
          <span class="rack-summary-word">${word}</span>
          <span class="rack-summary-score">${score} pts</span>
        </div>`;
    }).join('');
    document.getElementById('rack-summary-total-score').textContent = total + ' pts';
  }

  // Each rack mirrors what the server dealt: tiles [{letter, points}]
  // (10 per rack — 8 real letters + 2 wildcards, server-side) and
  // bottomBonuses, a same-length array of null | '2L' | '3L' keyed by
  // guess-slot position, not by which tile ends up sitting there.
  function makeRack(scramble) {
    return {
      tiles: scramble.tiles,
      bottomBonuses: scramble.bottomBonuses,
      guessSlots: scramble.tiles.map(() => null),
      heldWords: [], // { word, score }, in the order Hold was clicked
      overrideWord: null, // explicit choice from Override, beats heldWords entirely
      requestId: 0,
    };
  }

  // The rack's scored word: an explicit Override always wins; otherwise
  // the highest-scoring held word, ties broken toward whichever was
  // held first (heldWords is already in hold order, and only a strictly
  // greater score replaces the current best).
  function computeRackResult(rack) {
    if (rack.overrideWord) {
      const held = rack.heldWords.find((h) => h.word === rack.overrideWord);
      return { word: rack.overrideWord, valid: true, score: held ? held.score : 0 };
    }
    if (rack.heldWords.length === 0) return { word: '', valid: false, score: 0 };
    let best = rack.heldWords[0];
    for (const h of rack.heldWords) {
      if (h.score > best.score) best = h;
    }
    return { word: best.word, valid: true, score: best.score };
  }

  // A tray tile is "in the rack" (available to drag) exactly when no
  // guess slot currently holds it — derived rather than tracked
  // separately, so there's no separate flag that can drift out of sync.
  function isTrayIndexPlaced(rack, trayIndex) {
    return rack.guessSlots.some((e) => e && e.trayIndex === trayIndex);
  }

  // ---------- Audio (synthesized — no external files) ----------

  let audioCtx = null;
  function ctx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function tone(freq, startTime, duration, type, gainPeak) {
    const c = ctx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }

  function playGoodChime() {
    if (muted) return;
    const c = ctx(); const now = c.currentTime;
    tone(523.25, now, 0.16, 'sine', 0.18);
    tone(659.25, now + 0.1, 0.16, 'sine', 0.18);
    tone(783.99, now + 0.2, 0.28, 'sine', 0.2);
  }

  function playBadThud() {
    if (muted) return;
    const c = ctx(); const now = c.currentTime;
    tone(160, now, 0.22, 'square', 0.12);
    tone(110, now + 0.08, 0.26, 'square', 0.1);
  }

  function playWarnBeep(urgent) {
    if (muted) return;
    const c = ctx(); const now = c.currentTime;
    if (urgent) {
      tone(880, now, 0.12, 'sine', 0.16);
      tone(880, now + 0.18, 0.12, 'sine', 0.16);
      tone(880, now + 0.36, 0.16, 'sine', 0.18);
    } else {
      tone(660, now, 0.22, 'sine', 0.16);
    }
  }

  document.getElementById('mute-btn').addEventListener('click', () => {
    muted = !muted;
    const btn = document.getElementById('mute-btn');
    btn.textContent = muted ? '🔕' : '🔔';
    btn.classList.toggle('is-muted', muted);
  });

  // ---------- Scoring / validity for the active rack's current guess ----------
  //
  // The dictionary and scoring authority now live entirely on the
  // server (see MULTIPLAYER_PLAN.md §1 "one shared rules module") — this
  // file no longer has its own word list or point math. Only the
  // contiguous run starting at slot 0 counts as "the word being
  // attempted" (stops at the first gap); that's still decided
  // client-side since it's a UI convention, not a scoring rule.

  function bonusMultiplier(rack, slot) {
    const b = rack.bottomBonuses[slot];
    if (b === '2L') return 2;
    if (b === '3L') return 3;
    return 1;
  }

  function currentWordForRack(rack) {
    let word = '';
    for (const entry of rack.guessSlots) {
      if (!entry) break;
      word += entry.letter;
    }
    return word;
  }

  // Builds the server payload from the contiguous run and POSTs it to
  // /api/game/:id/guess, which returns the authoritative
  // { valid, word, score, belowMinimum, rawScore }.
  async function evaluateRackAsync(rack, scrambleIndex) {
    const filled = [];
    for (let slot = 0; slot < rack.guessSlots.length; slot++) {
      const entry = rack.guessSlots[slot];
      if (!entry) break;
      filled.push({ entry, slot });
    }

    const cells = filled.map(({ entry, slot }) => ({
      position: slot,
      letter: entry.letter,
      isWildcard: rack.tiles[entry.trayIndex].letter === '?',
    }));

    const res = await fetch(`/api/game/${GAME_ID}/guess`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scrambleIndex, cells }),
    });

    if (res.status === 401) {
      showScreen(authScreen);
      return { word: '', valid: false, belowMinimum: false, rawScore: 0, score: 0 };
    }
    if (!res.ok) {
      return { word: currentWordForRack(rack), valid: false, belowMinimum: false, rawScore: 0, score: 0 };
    }
    return res.json();
  }

  // ---------- Feedback firing (edge-triggered) ----------

  // Called exactly once per Save click (never while just typing), so
  // there's no need for the edge-triggering this used to require —
  // every call here is a deliberate submission and always fires.
  function fireSaveFeedback(evalResult) {
    const { valid, score } = evalResult;
    const card = document.getElementById('active-card');
    card.classList.remove('flash-good', 'flash-bad');
    void card.offsetWidth;
    if (valid && score >= 8) {
      card.classList.add('flash-good');
      playGoodChime();
    } else {
      card.classList.add('flash-bad');
      playBadThud();
    }
  }

  // ---------- Rendering ----------

  // Drag payload shape: { trayIndex, letter, fromSlot } — fromSlot is
  // the guess-row slot index if the drag started there, or null if it
  // started in the tray. Carried as JSON in dataTransfer.

  function setDragPayload(e, payload) {
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('application/json', JSON.stringify(payload));
  }

  function getDragPayload(e) {
    try { return JSON.parse(e.dataTransfer.getData('application/json')); }
    catch { return null; }
  }

  function renderTray(rack) {
    const el = document.getElementById('tray-tiles');
    el.innerHTML = rack.tiles.map((t, i) => {
      const placed = isTrayIndexPlaced(rack, i);
      return `<div class="tile${placed ? ' used' : ' draggable'}" data-i="${i}">${t.letter}<span class="pts">${t.points}</span></div>`;
    }).join('');

    Array.from(el.children).forEach((tileEl, i) => {
      if (isTrayIndexPlaced(rack, i)) return;
      const t = rack.tiles[i];
      tileEl.draggable = true;
      tileEl.addEventListener('dragstart', (e) => {
        setDragPayload(e, { trayIndex: i, letter: t.letter, fromSlot: null });
        tileEl.classList.add('dragging');
      });
      tileEl.addEventListener('dragend', () => tileEl.classList.remove('dragging'));
    });

    // Dropping a guess tile back onto the tray area removes it from the
    // guess row — it becomes available again purely by no longer being
    // referenced in guessSlots (see isTrayIndexPlaced).
    el.ondragover = (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    };
    el.ondrop = (e) => {
      e.preventDefault();
      const payload = getDragPayload(e);
      if (!payload || payload.fromSlot === null) return;
      rack.guessSlots[payload.fromSlot] = null;
      renderActive();
    };
  }

  function renderGuess(rack) {
    const el = document.getElementById('guess-tiles');
    el.innerHTML = rack.tiles.map((_, slot) => {
      const entry = rack.guessSlots[slot];
      const bonus = rack.bottomBonuses[slot];
      const bonusClass = bonus === '2L' ? ' bonus2' : bonus === '3L' ? ' bonus3' : '';
      if (!entry) {
        return `<div class="tile empty${bonusClass}" data-slot="${slot}"></div>`;
      }
      const isWildcard = rack.tiles[entry.trayIndex].letter === '?';
      const pts = rack.tiles[entry.trayIndex].points * bonusMultiplier(rack, slot);
      return `<div class="tile draggable${bonusClass}${isWildcard ? ' wildcard-placed' : ''}" data-slot="${slot}">${entry.letter}<span class="pts">${pts}</span></div>`;
    }).join('');

    Array.from(el.children).forEach((tileEl, slot) => {
      const entry = rack.guessSlots[slot];

      if (entry) {
        tileEl.draggable = true;
        tileEl.addEventListener('dragstart', (e) => {
          setDragPayload(e, { trayIndex: entry.trayIndex, letter: entry.letter, fromSlot: slot });
          tileEl.classList.add('dragging');
        });
        tileEl.addEventListener('dragend', () => tileEl.classList.remove('dragging'));

        // Double-click sends a tile back to the tray — except an
        // unresolved wildcard (still showing '?'), where it opens the
        // letter picker instead. Once that wildcard has a letter
        // chosen, double-clicking it behaves like any other tile and
        // returns it (reverting it to an unresolved '?' back in the
        // tray, same as dragging it there).
        tileEl.addEventListener('dblclick', (e) => {
          e.preventDefault();
          const isWildcard = rack.tiles[entry.trayIndex].letter === '?';
          if (isWildcard && entry.letter === '?') {
            openWildcardPicker(rack, slot, tileEl);
            return;
          }
          rack.guessSlots[slot] = null;
          renderActive();
        });
      }

      tileEl.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        tileEl.classList.add('drop-hover');
      });
      tileEl.addEventListener('dragleave', () => tileEl.classList.remove('drop-hover'));
      tileEl.addEventListener('drop', (e) => {
        e.preventDefault();
        tileEl.classList.remove('drop-hover');
        const payload = getDragPayload(e);
        if (!payload) return;
        placeTile(rack, slot, payload);
      });
    });
  }

  // Drops `payload` into guessSlots[targetSlot]. Whatever already
  // occupied that slot is displaced back to the tray (not swapped into
  // the drag source) — same rule as the real game. If the drag came
  // from another guess slot, that slot is vacated.
  function placeTile(rack, targetSlot, payload) {
    if (payload.fromSlot === targetSlot) return; // dropped back on itself

    // An unresolved wildcard (payload.letter still '?') needs its letter
    // chosen right now, not left blank for later — this is what makes
    // "must be in the right position at the beginning" true: by the
    // time this function returns, every wildcard in the guess row either
    // already had a letter or is about to be asked for one immediately.
    const needsWildcardPicker = payload.letter === '?';

    rack.guessSlots[targetSlot] = { trayIndex: payload.trayIndex, letter: payload.letter };

    if (payload.fromSlot !== null) {
      rack.guessSlots[payload.fromSlot] = null;
    }
    // The displaced occupant (if any) needs no explicit handling — it's
    // back in the tray automatically the moment nothing in guessSlots
    // references its trayIndex any more.

    renderActive();

    if (needsWildcardPicker) {
      const tileEl = document.querySelector(`#guess-tiles .tile[data-slot="${targetSlot}"]`);
      if (tileEl) openWildcardPicker(rack, targetSlot, tileEl);
    }
  }

  // ---------- Wildcard letter picker ----------

  let openMenuEl = null;

  function closeWildcardPicker() {
    if (openMenuEl) { openMenuEl.remove(); openMenuEl = null; }
    document.removeEventListener('click', handleOutsideMenuClick);
    document.removeEventListener('keydown', handleMenuEscape);
  }

  function handleOutsideMenuClick(e) {
    if (openMenuEl && !openMenuEl.contains(e.target)) closeWildcardPicker();
  }

  function handleMenuEscape(e) {
    if (e.key === 'Escape') closeWildcardPicker();
  }

  // Opens the A-Z picker for a wildcard already sitting in guess slot
  // `slot`, letting its displayed letter be assigned/reassigned. Points
  // stay 0 regardless of what's picked (see renderGuess).
  function openWildcardPicker(rack, slot, tileEl) {
    closeWildcardPicker();
    const menu = document.createElement('div');
    menu.className = 'letter-menu';
    for (let i = 0; i < 26; i++) {
      const letter = String.fromCharCode(65 + i);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = letter;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        rack.guessSlots[slot] = { trayIndex: rack.guessSlots[slot].trayIndex, letter };
        closeWildcardPicker();
        renderActive();
      });
      menu.appendChild(btn);
    }
    document.body.appendChild(menu);

    const rect = tileEl.getBoundingClientRect();
    const menuRect = menu.getBoundingClientRect();
    let left = rect.left;
    let top = rect.bottom + 6;
    if (top + menuRect.height + 8 > window.innerHeight) top = rect.top - menuRect.height - 6;
    if (left + menuRect.width + 8 > window.innerWidth) left = window.innerWidth - menuRect.width - 8;
    menu.style.left = `${Math.max(8, left)}px`;
    menu.style.top = `${Math.max(8, top)}px`;

    openMenuEl = menu;
    setTimeout(() => {
      document.addEventListener('click', handleOutsideMenuClick);
      document.addEventListener('keydown', handleMenuEscape);
    }, 0);
  }

  // Color alone carries the verdict (black while forming/checking,
  // green valid, red invalid) — no icon, no "valid word"/"not a word"
  // text. This runs continuously as tiles are placed — you always know
  // whether the word you've built is valid and what it's worth before
  // deciding to hold or override it. What it never does on its own is
  // make a sound, touch the header score, or count toward anything —
  // that's only ever holdWord's/applyOverride's job.
  function renderWordStatus(evalResult) {
    const { word, valid, belowMinimum, rawScore, score, checking } = evalResult;
    const statusEl = document.getElementById('word-status');
    const state = word.length === 0 ? 'empty'
      : word.length < MIN_WORD_LEN ? 'building'
      : checking ? 'building'
      : valid ? 'valid' : 'invalid';
    statusEl.className = 'word-status state-' + state;
    document.getElementById('word-text').textContent = word;

    let scoreText;
    if (checking) scoreText = '…';
    else if (state === 'valid') scoreText = score + ' pts';
    else if (state === 'invalid' && belowMinimum) scoreText = rawScore + ' pts';
    else scoreText = '0 pts';
    document.getElementById('verdict-score').textContent = scoreText;
  }

  // The header total is the sum of each rack's computed result (see
  // computeRackResult) — never the live preview — so it only moves when
  // you Hold or Override a word, not while you're still fiddling with
  // tiles.
  function renderHeaderScore() {
    const total = RACKS.reduce((sum, r) => sum + computeRackResult(r).score, 0);
    document.getElementById('score-value').textContent = total;
  }

  function renderActive() {
    const rack = RACKS[currentIndex];

    renderTray(rack);
    renderGuess(rack);

    document.getElementById('rack-indicator').textContent = `Rack ${currentIndex + 1} of ${RACKS.length}`;
    document.getElementById('erase-btn').disabled = rack.guessSlots.every((e) => e === null);

    const word = currentWordForRack(rack);
    const hasUnresolvedWildcard = rack.guessSlots.some((e) => e && e.letter === '?');
    const disableActions = word.length < MIN_WORD_LEN || hasUnresolvedWildcard;
    document.getElementById('hold-btn').disabled = disableActions;
    document.getElementById('override-btn').disabled = disableActions;
    const myRequestId = ++rack.requestId;

    if (word.length < MIN_WORD_LEN) {
      renderWordStatus({ word, valid: false, belowMinimum: false, rawScore: 0, score: 0 });
      return;
    }

    renderWordStatus({ word, valid: false, belowMinimum: false, rawScore: 0, score: 0, checking: true });

    evaluateRackAsync(rack, currentIndex).then((result) => {
      if (rack.requestId !== myRequestId) return; // superseded by a newer change
      renderWordStatus(result); // preview only — no sound, no score update yet
    });
  }

  // Hold — remembers the current word as a candidate for this rack
  // without necessarily becoming the one that's scored. Whichever held
  // candidate has the highest score is what counts (see
  // computeRackResult); holding a lower-scoring word never displaces a
  // better one already held, it just adds another option. Re-checks
  // with the server rather than trusting whatever the live preview
  // last showed, so a hold is always accurate even if something
  // changed mid-flight.
  async function holdWord(rack) {
    const word = currentWordForRack(rack);
    if (word.length < MIN_WORD_LEN) return;
    if (rack.guessSlots.some((e) => e && e.letter === '?')) return; // unresolved wildcard — shouldn't happen, but don't submit a blank

    document.getElementById('hold-btn').disabled = true;
    const myRequestId = ++rack.requestId;
    const result = await evaluateRackAsync(rack, currentIndex);
    if (rack.requestId !== myRequestId) return; // superseded by a newer change

    renderWordStatus(result);
    fireSaveFeedback(result);

    if (result.valid) {
      const existing = rack.heldWords.find((h) => h.word === result.word);
      if (existing) existing.score = result.score;
      else rack.heldWords.push({ word: result.word, score: result.score });
    }

    renderHeaderScore();
    renderRackSummary();
    document.getElementById('hold-btn').disabled = currentWordForRack(rack).length < MIN_WORD_LEN;
  }

  document.getElementById('hold-btn').addEventListener('click', () => {
    holdWord(RACKS[currentIndex]);
  });

  // Override — forces the current word to be the one scored for this
  // rack, regardless of what's held or what scores higher. Also holds
  // it (if not already held) so it has a score to report.
  async function applyOverride(rack) {
    const word = currentWordForRack(rack);
    if (word.length < MIN_WORD_LEN) return;
    if (rack.guessSlots.some((e) => e && e.letter === '?')) return;

    document.getElementById('override-btn').disabled = true;
    const myRequestId = ++rack.requestId;
    const result = await evaluateRackAsync(rack, currentIndex);
    if (rack.requestId !== myRequestId) return;

    renderWordStatus(result);
    fireSaveFeedback(result);

    if (result.valid) {
      const existing = rack.heldWords.find((h) => h.word === result.word);
      if (existing) existing.score = result.score;
      else rack.heldWords.push({ word: result.word, score: result.score });
      rack.overrideWord = result.word;
    }

    renderHeaderScore();
    renderRackSummary();
    document.getElementById('override-btn').disabled = currentWordForRack(rack).length < MIN_WORD_LEN;
  }

  document.getElementById('override-btn').addEventListener('click', () => {
    applyOverride(RACKS[currentIndex]);
  });

  // Sends every placed tile back to the tray in one shot, so a dead-end
  // guess doesn't have to be undone letter by letter.
  function clearGuess(rack) {
    rack.guessSlots = rack.guessSlots.map(() => null);
    renderActive();
  }

  document.getElementById('erase-btn').addEventListener('click', () => {
    clearGuess(RACKS[currentIndex]);
  });

  document.getElementById('nav-next').addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % RACKS.length;
    renderActive();
  });

  // ---------- Countdown timer with 1:00 / 0:15 warnings ----------

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function tickTimer() {
    timeLeft--;
    const stat = document.getElementById('timer-stat');
    const valueEl = document.getElementById('timer-value');

    if (timeLeft <= 0) {
      timeLeft = 0;
      valueEl.textContent = '00:00';
      stat.classList.add('time-up');
      clearInterval(timerHandle);
      return;
    }

    valueEl.textContent = formatTime(timeLeft);

    if (timeLeft <= 15 && !warned15s) {
      warned15s = true;
      stat.classList.remove('warn-1min');
      stat.classList.add('warn-15s');
      playWarnBeep(true);
    } else if (timeLeft <= 60 && !warned1min) {
      warned1min = true;
      stat.classList.add('warn-1min');
      playWarnBeep(false);
    }
  }

  function startTimer() {
    clearInterval(timerHandle);
    timeLeft = GAME_SECONDS;
    warned1min = false;
    warned15s = false;
    const stat = document.getElementById('timer-stat');
    stat.classList.remove('warn-1min', 'warn-15s', 'time-up');
    document.getElementById('timer-value').textContent = formatTime(timeLeft);
    timerHandle = setInterval(tickTimer, 1000);
  }

  document.getElementById('new-game-btn').addEventListener('click', () => {
    startGame();
  });

  // ---------- Layout editor ----------
  // Every id listed below becomes an independently moveable/resizable
  // object once edit mode is on — drag to move, drag a corner/edge
  // handle to resize, shift-click to multi-select, Group/Ungroup to
  // combine or split a selection. Deliberately no rotation anywhere.
  // Positions persist in localStorage and are re-applied on every load
  // (in or out of edit mode), so a custom arrangement sticks around.
  //
  // Only the objects listed here are individually placeable — the
  // tile rows move/resize as whole rows, not tile-by-tile, since
  // individual tiles are regenerated by the game logic on every
  // render and can't hold a stable independent position.

  const LAYOUT_STORAGE_KEY = 'gerbil_layout_v1';
  const EDITABLE_IDS = [
    'brand-title', 'username-label', 'timer-stat', 'score-stat',
    'mute-btn', 'feedback-btn', 'logout-btn',
    'tray-tiles', 'guess-tiles', 'hold-btn', 'override-btn', 'erase-btn',
    'word-status', 'rack-indicator', 'nav-next', 'new-game-btn',
    'rack-summary-panel',
  ];

  let layout = {};    // id -> { x, y, w, h, groupId? }
  let groups = {};    // groupId -> { memberIds: [...] }
  let editModeOn = false;
  let selection = new Set(); // object ids and/or group ids
  let nextGroupNum = 1;
  let dragState = null;

  const captureLayer = document.getElementById('edit-capture-layer');
  const editToolbar = document.getElementById('edit-toolbar');
  const groupBtn = document.getElementById('group-btn');
  const ungroupBtn = document.getElementById('ungroup-btn');

  function loadLayoutFromStorage() {
    try {
      const raw = localStorage.getItem(LAYOUT_STORAGE_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      layout = parsed.layout || {};
      groups = parsed.groups || {};
    } catch (err) {
      layout = {};
      groups = {};
    }
  }

  function persistLayout() {
    localStorage.setItem(LAYOUT_STORAGE_KEY, JSON.stringify({ layout, groups }));
  }

  // Converts whatever's currently on screen (native flow position, via
  // CSS) into an absolute {x,y,w,h} relative to #game-screen — called
  // once per id, the first time it's ever touched, so nothing jumps
  // when edit mode is first turned on.
  function captureRect(id) {
    const el = document.getElementById(id);
    if (!el) return null;
    const elRect = el.getBoundingClientRect();
    const containerRect = gameScreen.getBoundingClientRect();
    return {
      x: Math.round(elRect.left - containerRect.left),
      y: Math.round(elRect.top - containerRect.top),
      w: Math.round(elRect.width),
      h: Math.round(elRect.height),
    };
  }

  function ensureLayoutEntries() {
    EDITABLE_IDS.forEach((id) => {
      if (!layout[id]) {
        const rect = captureRect(id);
        if (rect) layout[id] = rect;
      }
    });
  }

  // Applies layout[] to the real DOM elements. Safe to call any time —
  // idempotent, a no-op for any id with no layout entry yet.
  function applyLayoutStyles() {
    let maxBottom = 0;
    let any = false;
    EDITABLE_IDS.forEach((id) => {
      const el = document.getElementById(id);
      const L = layout[id];
      if (!el || !L) return;
      any = true;
      el.style.position = 'absolute';
      el.style.left = L.x + 'px';
      el.style.top = L.y + 'px';
      el.style.width = L.w + 'px';
      el.style.height = L.h + 'px';
      el.style.margin = '0';
      maxBottom = Math.max(maxBottom, L.y + L.h);
    });
    if (any) {
      gameScreen.style.position = 'relative';
      gameScreen.style.minHeight = (maxBottom + 40) + 'px';
    }
  }

  function groupIdForObject(id) {
    return layout[id] && layout[id].groupId;
  }

  function memberIdsOf(selIds) {
    const out = [];
    selIds.forEach((id) => {
      if (groups[id]) groups[id].memberIds.forEach((m) => out.push(m));
      else out.push(id);
    });
    return out;
  }

  function boundsOf(selIds) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    memberIdsOf(selIds).forEach((id) => {
      const L = layout[id];
      if (!L) return;
      minX = Math.min(minX, L.x);
      minY = Math.min(minY, L.y);
      maxX = Math.max(maxX, L.x + L.w);
      maxY = Math.max(maxY, L.y + L.h);
    });
    if (minX === Infinity) return null;
    return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  }

  function hitTest(x, y) {
    // Later ids sit later in the DOM (rendered on top) in this app —
    // search in reverse to find the topmost hit.
    for (let i = EDITABLE_IDS.length - 1; i >= 0; i--) {
      const id = EDITABLE_IDS[i];
      const L = layout[id];
      if (!L) continue;
      if (x >= L.x && x <= L.x + L.w && y >= L.y && y <= L.y + L.h) {
        return groupIdForObject(id) || id;
      }
    }
    return null;
  }

  function localPoint(e) {
    const rect = gameScreen.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  // ---------- Selection rendering ----------

  function clearSelectionVisuals() {
    gameScreen.querySelectorAll('.edit-outline, .edit-handle').forEach((el) => el.remove());
  }

  function renderSelection() {
    clearSelectionVisuals();
    const selArr = [...selection];
    groupBtn.disabled = selection.size < 2;
    ungroupBtn.disabled = !(selection.size === 1 && groups[selArr[0]]);

    selArr.forEach((id) => {
      const isGroup = !!groups[id];
      const box = isGroup ? boundsOf([id]) : layout[id];
      if (!box) return;
      const outline = document.createElement('div');
      outline.className = 'edit-outline' + (isGroup ? ' is-group' : '');
      outline.style.left = box.x + 'px';
      outline.style.top = box.y + 'px';
      outline.style.width = box.w + 'px';
      outline.style.height = box.h + 'px';
      gameScreen.appendChild(outline);
    });

    if (selection.size === 1) {
      const id = selArr[0];
      const isGroup = !!groups[id];
      const box = isGroup ? boundsOf([id]) : layout[id];
      if (box) renderHandles(box);
    }
  }

  const HANDLE_DIRS = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'];

  function handlePosition(box, dir) {
    const midX = box.x + box.w / 2;
    const midY = box.y + box.h / 2;
    switch (dir) {
      case 'nw': return { x: box.x, y: box.y };
      case 'n': return { x: midX, y: box.y };
      case 'ne': return { x: box.x + box.w, y: box.y };
      case 'e': return { x: box.x + box.w, y: midY };
      case 'se': return { x: box.x + box.w, y: box.y + box.h };
      case 's': return { x: midX, y: box.y + box.h };
      case 'sw': return { x: box.x, y: box.y + box.h };
      case 'w': return { x: box.x, y: midY };
    }
  }

  function renderHandles(box) {
    HANDLE_DIRS.forEach((dir) => {
      const handle = document.createElement('div');
      handle.className = 'edit-handle';
      handle.dataset.dir = dir;
      const pos = handlePosition(box, dir);
      handle.style.left = pos.x + 'px';
      handle.style.top = pos.y + 'px';
      handle.addEventListener('mousedown', (e) => startResize(e, dir));
      gameScreen.appendChild(handle);
    });
  }

  // ---------- Move ----------

  captureLayer.addEventListener('mousedown', (e) => {
    const pt = localPoint(e);
    const hitId = hitTest(pt.x, pt.y);

    if (!hitId) {
      selection.clear();
      renderSelection();
      return;
    }

    if (e.shiftKey) {
      if (selection.has(hitId)) selection.delete(hitId); else selection.add(hitId);
    } else if (!selection.has(hitId)) {
      selection = new Set([hitId]);
    }
    renderSelection();

    const members = memberIdsOf(selection);
    if (members.length === 0) return;

    dragState = {
      kind: 'move',
      startX: pt.x,
      startY: pt.y,
      starts: members.map((id) => ({ id, x: layout[id].x, y: layout[id].y })),
    };
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragState) return;
    const pt = localPoint(e);
    if (dragState.kind === 'move') {
      const dx = pt.x - dragState.startX;
      const dy = pt.y - dragState.startY;
      dragState.starts.forEach(({ id, x, y }) => {
        layout[id].x = x + dx;
        layout[id].y = y + dy;
      });
      applyLayoutStyles();
      renderSelection();
    } else if (dragState.kind === 'resize') {
      applyResize(pt);
      applyLayoutStyles();
      renderSelection();
    }
  });

  document.addEventListener('mouseup', () => {
    if (!dragState) return;
    dragState = null;
    persistLayout();
  });

  // ---------- Resize ----------

  const MIN_SIZE = 20;

  function startResize(e, dir) {
    e.stopPropagation();
    e.preventDefault();
    const id = [...selection][0];
    const isGroup = !!groups[id];
    const box = isGroup ? boundsOf([id]) : layout[id];
    const memberIds = isGroup ? groups[id].memberIds : [id];
    dragState = {
      kind: 'resize',
      dir,
      startBox: { ...box },
      memberStarts: memberIds.map((mid) => ({ id: mid, ...layout[mid] })),
    };
  }

  function applyResize(pt) {
    const { dir, startBox, memberStarts } = dragState;
    let { x, y, w, h } = startBox;
    const right = startBox.x + startBox.w;
    const bottom = startBox.y + startBox.h;

    if (dir.includes('e')) w = Math.max(MIN_SIZE, pt.x - startBox.x);
    if (dir.includes('s')) h = Math.max(MIN_SIZE, pt.y - startBox.y);
    if (dir.includes('w')) { x = Math.min(pt.x, right - MIN_SIZE); w = right - x; }
    if (dir.includes('n')) { y = Math.min(pt.y, bottom - MIN_SIZE); h = bottom - y; }

    const scaleX = startBox.w === 0 ? 1 : w / startBox.w;
    const scaleY = startBox.h === 0 ? 1 : h / startBox.h;

    memberStarts.forEach((m) => {
      layout[m.id] = {
        ...layout[m.id],
        x: Math.round(x + (m.x - startBox.x) * scaleX),
        y: Math.round(y + (m.y - startBox.y) * scaleY),
        w: Math.round(Math.max(MIN_SIZE, m.w * scaleX)),
        h: Math.round(Math.max(MIN_SIZE, m.h * scaleY)),
      };
    });
  }

  // ---------- Group / ungroup ----------

  groupBtn.addEventListener('click', () => {
    if (selection.size < 2) return;
    const members = memberIdsOf(selection);
    selection.forEach((id) => { if (groups[id]) delete groups[id]; });

    const groupId = 'group-' + (nextGroupNum++);
    groups[groupId] = { memberIds: members };
    members.forEach((id) => { layout[id].groupId = groupId; });

    selection = new Set([groupId]);
    persistLayout();
    renderSelection();
  });

  ungroupBtn.addEventListener('click', () => {
    if (selection.size !== 1) return;
    const groupId = [...selection][0];
    const group = groups[groupId];
    if (!group) return;
    group.memberIds.forEach((id) => { if (layout[id]) delete layout[id].groupId; });
    delete groups[groupId];
    selection = new Set(group.memberIds);
    persistLayout();
    renderSelection();
  });

  // ---------- Mode toggle ----------

  function enterEditMode() {
    editModeOn = true;
    ensureLayoutEntries();
    applyLayoutStyles();
    gameScreen.classList.add('edit-mode');
    editToolbar.style.display = 'flex';
    selection = new Set();
    renderSelection();
  }

  function exitEditMode() {
    editModeOn = false;
    gameScreen.classList.remove('edit-mode');
    editToolbar.style.display = 'none';
    selection = new Set();
    clearSelectionVisuals();
  }

  document.getElementById('edit-layout-btn').addEventListener('click', () => {
    if (editModeOn) exitEditMode(); else enterEditMode();
  });
  document.getElementById('done-editing-btn').addEventListener('click', exitEditMode);

  document.getElementById('reset-layout-btn').addEventListener('click', () => {
    if (!confirm('Reset the layout back to default?')) return;
    localStorage.removeItem(LAYOUT_STORAGE_KEY);
    location.reload();
  });

  // Re-applies any previously-saved layout on every load, in or out of
  // edit mode, so a custom arrangement sticks around across sessions.
  loadLayoutFromStorage();
  applyLayoutStyles();
</script>
