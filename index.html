<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Many Words</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>

<header id="top-bar">
  <div class="brand">Many Words</div>
  <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
  <div class="stat"><span class="label">Time</span><span id="timer">10:00</span></div>
  <button id="start-btn">Start Game</button>
  <button id="stop-btn" class="hidden">Stop Game</button>
  <button id="grid-toggle-btn" type="button">Show Grid</button>
</header>

<main id="game" class="hidden">
  <div id="scrambles"></div>
  <div id="stats-panel"></div>
</main>

<div id="game-over" class="hidden">
  <div class="panel">
    <h2>Time's up!</h2>
    <div id="final-stats"></div>
    <button id="play-again-btn">Play Again</button>
  </div>
</div>

<script src="words.js"></script>
<script src="game.js?v=5"></script>
</body>
</html>
